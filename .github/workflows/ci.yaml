name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - rust-hour-common
          - rust-hour-gateway
          - rust-hour-auth
          - rust-hour-monitor
          - rust-hour-monitor-query
          - rust-hour-alert
          - rust-hour-saga

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}

      - name: Create test databases
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE auth_db;"
          psql -h localhost -U postgres -c "CREATE DATABASE monitor_db;"
          psql -h localhost -U postgres -c "CREATE DATABASE alert_db;"
          psql -h localhost -U postgres -c "CREATE DATABASE saga_db;"

      - name: Build
        env:
          BUILD_CRATE: ${{ matrix.crate }}
        run: cargo build -p "$BUILD_CRATE" --verbose

      - name: Test
        env:
          TEST_CRATE: ${{ matrix.crate }}
          AUTH_DATABASE_URL: postgres://postgres:password@localhost:5432/auth_db
          MONITOR_DATABASE_URL: postgres://postgres:password@localhost:5432/monitor_db
          ALERT_DATABASE_URL: postgres://postgres:password@localhost:5432/alert_db
          SAGA_DATABASE_URL: postgres://postgres:password@localhost:5432/saga_db
          PASETO_KEY: "test-key-that-is-32-bytes-long!!"
          KAFKA_BROKERS: "localhost:9092"
          REDIS_URL: "redis://localhost:6379"
        run: cargo test -p "$TEST_CRATE" --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
