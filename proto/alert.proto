syntax = "proto3";
package alert;

service AlertService {
    rpc CreateRule(CreateRuleRequest) returns (RuleResponse);
    rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
    rpc UpdateRule(UpdateRuleRequest) returns (RuleResponse);
    rpc DeleteRule(DeleteRuleRequest) returns (SuccessResponse);
    rpc CreateChannel(CreateChannelRequest) returns (ChannelResponse);
    rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
    rpc DeleteChannel(DeleteChannelRequest) returns (SuccessResponse);
    rpc GetHistory(GetHistoryRequest) returns (HistoryResponse);

    // Saga support: bulk operations for account deletion
    rpc DeleteAllForAccount(DeleteAllForAccountRequest) returns (DeleteAllForAccountResponse);
    rpc RestoreForAccount(RestoreForAccountRequest) returns (SuccessResponse);
}

message CreateRuleRequest {
    string account_id = 1;
    string endpoint_id = 2;
    string rule_type = 3;
    int32 threshold_value = 4;
    int32 consecutive_failures = 5;
}

message RuleResponse {
    string id = 1;
    string account_id = 2;
    string endpoint_id = 3;
    string rule_type = 4;
    int32 threshold_value = 5;
    int32 consecutive_failures = 6;
    bool is_active = 7;
    string created_at = 8;
}

message ListRulesRequest {
    string account_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListRulesResponse {
    repeated RuleResponse rules = 1;
    int32 total = 2;
}

message UpdateRuleRequest {
    string id = 1;
    string account_id = 2;
    optional string rule_type = 3;
    optional int32 threshold_value = 4;
    optional int32 consecutive_failures = 5;
    optional bool is_active = 6;
}

message DeleteRuleRequest {
    string id = 1;
    string account_id = 2;
}

message SuccessResponse {
    bool success = 1;
    string message = 2;
}

message CreateChannelRequest {
    string account_id = 1;
    string channel_type = 2;
    string config_json = 3;
}

message ChannelResponse {
    string id = 1;
    string account_id = 2;
    string channel_type = 3;
    string config_json = 4;
    string created_at = 5;
}

message ListChannelsRequest {
    string account_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListChannelsResponse {
    repeated ChannelResponse channels = 1;
    int32 total = 2;
}

message DeleteChannelRequest {
    string id = 1;
    string account_id = 2;
}

message GetHistoryRequest {
    string account_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message AlertEvent {
    string id = 1;
    string alert_rule_id = 2;
    string channel_id = 3;
    string status = 4;
    string message = 5;
    string triggered_at = 6;
}

message HistoryResponse {
    repeated AlertEvent events = 1;
    int32 total = 2;
}

// Saga messages
message DeleteAllForAccountRequest {
    string account_id = 1;
}

message DeleteAllForAccountResponse {
    bool success = 1;
    int32 deleted_rules = 2;
    int32 deleted_channels = 3;
}

message RestoreForAccountRequest {
    string account_id = 1;
}
