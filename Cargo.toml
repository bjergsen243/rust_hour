[workspace]
members = [
    "crates/common",
    "crates/gateway",
    "crates/auth-service",
    "crates/monitor-service",
    "crates/monitor-query-service",
    "crates/alert-service",
    "crates/saga-orchestrator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Son Nguyen Thanh <thanhsondeptrai243@gmail.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework (gateway)
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
rust-argon2 = "1.0"
paseto = "2.0"

# HTTP client (probes)
reqwest = { version = "0.12", features = ["json"] }

# Message broker (Kafka)
rdkafka = { version = "0.37", features = ["cmake-build"] }

# Caching / rate limiting
fred = { version = "10", features = ["subscriber-client"] }

# Scheduling
tokio-cron-scheduler = "0.13"

# Config
config = "0.14"

# Logging / tracing
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Misc
rand = "0.8"
regex = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
futures = "0.3"

# Testing
mockall = "0.13"
